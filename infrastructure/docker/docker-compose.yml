# Event OS local stack (docs/16 §Containerization / R2-02).
# From repository root:
#   docker compose -f infrastructure/docker/docker-compose.yml up -d --build
#
# Service DNS names (`postgres`, `redis`) are used inside the compose network.
# Host-machine clients still reach Postgres/Redis via the published localhost ports.

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventos-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: eventos
      POSTGRES_PASSWORD: eventos
      POSTGRES_DB: eventos
    volumes:
      - eventos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventos -d eventos']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eventos-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - eventos_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # R2-02 — API service built from the R2-01 multi-stage Dockerfile.
  # Compose-local env uses in-network hostnames; apps/api/.env (localhost) is for
  # host-run `pnpm start:dev` and is intentionally not mounted here.
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    image: eventos-api:local
    container_name: eventos-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      # Production image (R2-01) prunes pino-pretty; development/test NODE_ENV
      # would load that transport and crash. Use production + explicit CORS
      # (R1-06 forbids "*" outside development).
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:5173,http://localhost:4000
      DATABASE_URL: postgresql://eventos:eventos@postgres:5432/eventos?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Matches apps/api/.env.example — override via shell env when needed:
      #   JWT_SECRET=... docker compose ... up
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-secure-secret-at-least-32-characters}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Node 22 provides global fetch; alpine image has no curl/wget by default.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  eventos_postgres_data:
  eventos_redis_data:
