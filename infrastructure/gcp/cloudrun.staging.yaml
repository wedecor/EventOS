# M5-01 — Cloud Run service definition (staging). Rendered by deploy.sh, which
# substitutes __IMAGE__ and __CORS_ORIGIN__ (plain sed). Deployed with:
#   gcloud run services replace <rendered.yaml> --project wedecorenquries --region asia-south1
# No secret values live here — only Secret Manager references (see README step 7).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: eventos-api-staging
  labels:
    cloud.googleapis.com/location: asia-south1
    app: eventos-api
    environment: staging
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cloudsql-instances: wedecorenquries:asia-south1:eventos-pg
        run.googleapis.com/vpc-access-connector: eventos-connector
        run.googleapis.com/vpc-access-egress: private-ranges-only
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: eventos-api-staging@wedecorenquries.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - image: __IMAGE__
          ports:
            - name: http1
              containerPort: 4000
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: staging
            - name: PORT
              value: "4000"
            - name: LOG_LEVEL
              value: info
            - name: CORS_ORIGIN
              value: "__CORS_ORIGIN__"
            # Tenant for the Enquiries feed (config, never the request body). Public id.
            - name: ENQUIRIES_FEED_TENANT_ID
              value: "00000000-0000-0000-0000-000000000001"
            # Replaced by durable GCS in the follow-up storage commit.
            - name: STORAGE_PROVIDER
              value: local
            - name: STORAGE_LOCAL_ROOT
              value: /tmp/eventos-uploads
            - name: MAIL_PROVIDER
              value: none
            - name: AI_PROVIDER
              value: none
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eventos-staging-jwt-secret
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eventos-staging-database-url
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: eventos-staging-redis-url
                  key: latest
            - name: ENQUIRIES_FEED_SECRET
              valueFrom:
                secretKeyRef:
                  name: eventos-staging-enquiries-feed-secret
                  key: latest
            # A single space (blank) disables Sentry; see README step 6.
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: eventos-staging-sentry-dsn
                  key: latest
          startupProbe:
            httpGet:
              path: /health/ready
              port: 4000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
  traffic:
    - latestRevision: true
      percent: 100
