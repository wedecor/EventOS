# R2-09 — bucket / prefix layout (repository template only).
# Matches docs/10 §File Storage Strategy:
#   {tenantId}/{module}/{entityId}/{objectName}

version: 1
path_template: "{tenantId}/{module}/{entityId}/{objectName}"
phase1_tenant_id: "00000000-0000-0000-0000-000000000001"

buckets:
  development: eventos-dev
  staging: eventos-staging
  production: eventos-prod

modules:
  - id: quotation
    description: Quotation attachments
  - id: vendor
    description: Vendor master documents
  - id: procurement
    description: Per-event vendor invoices / bills
  - id: expense
    description: Expense receipts
  - id: payment
    description: Customer payment proofs (EP1-FIN-003)
  - id: event
    description: Event photos / deliverables
  - id: content
    description: Marketing / content library
  - id: inventory
    description: Inventory item / movement photos (EP1-INV-007)
  - id: document
    description: Generic tenant documents

examples:
  - key: "00000000-0000-0000-0000-000000000001/payment/11111111-1111-1111-1111-111111111111/aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa.jpg"
    use_case: payment_proof
  - key: "00000000-0000-0000-0000-000000000001/expense/22222222-2222-2222-2222-222222222222/bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb.pdf"
    use_case: expense_receipt
  - key: "00000000-0000-0000-0000-000000000001/event/33333333-3333-3333-3333-333333333333/cccccccc-cccc-cccc-cccc-cccccccccccc.webp"
    use_case: event_photo
