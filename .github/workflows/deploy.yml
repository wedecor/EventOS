# M5-01 — Deploy the API to Google Cloud Run (docs/16 §Deployment, infrastructure/gcp/).
#
#   push to main      → staging (automatic)
#   push of tag v*    → production (waits for GitHub Environment approval)
#
# Authentication uses Workload Identity Federation (OIDC): no service-account JSON
# keys exist anywhere. Per-environment GitHub *variables* (not secrets):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<n>/locations/global/workloadIdentityPools/github/providers/github-oidc
#   GCP_DEPLOYER_SERVICE_ACCOUNT    eventos-deployer@wedecorenquries.iam.gserviceaccount.com
#   CORS_ORIGIN                     explicit HTTPS admin-portal origin for that environment
# Configure the `production` environment with required reviewers (one-time, README §7).

name: Deploy

"on":
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

# Never cancel a running deploy; queue the next one instead.
concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'staging' }}
  cancel-in-progress: false

env:
  PROJECT_ID: wedecorenquries
  REGION: asia-south1

jobs:
  verify:
    name: Verify (build · test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    env:
      # prisma.config.ts requires DATABASE_URL at generate time (no DB connection).
      DATABASE_URL: postgresql://eventos:eventos@127.0.0.1:5432/eventos?schema=public
      # Unit suites that boot ConfigModule need a valid secret (R1-04).
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long
      NODE_ENV: test
      CI: true
      AI_PROVIDER: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/api/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm build
      - run: pnpm exec jest --forceExit

  staging:
    name: Deploy · staging
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Deploy
        run: infrastructure/gcp/deploy.sh staging
        env:
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}

  production:
    name: Deploy · production
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers on this environment gate the job before it starts.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Deploy
        run: infrastructure/gcp/deploy.sh prod
        env:
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
